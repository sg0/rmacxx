name: CI

# Controls when the workflow will run
on: [push,pull_request,workflow_dispatch]

jobs:
  # GitHub-hosted runners have no GPUs: the test-suite is built against the
  # CPU emulation of CUDA/NVSHMEM/MPI in tests/emulator (one PE per thread).
  emulator:
    runs-on: ubuntu-22.04
    name: emulator
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up g++
        run:  (echo "y" | sudo apt install g++-12) && sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 50
      - name: Get CMake
        uses: lukka/get-cmake@latest
      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: emulator
          buildPreset: emulator
          testPreset: emulator
